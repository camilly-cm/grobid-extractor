[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grobid-extractor"
version = "0.1.0"
description = "Scientific text extraction from PDFs using a GROBID server, with explicit endpoint selection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    # Used only for its TEI -> JSON / Markdown converters
    "grobid-client-python>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
grobid-extract = "grobid_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
